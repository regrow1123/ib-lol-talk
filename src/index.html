<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ib-lol talk</title>
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="screen active">
    <div class="setup-container">
      <h1>ib-lol talk</h1>
      <p class="subtitle">리신 1v1 라인전</p>

      <div class="setup-section">
        <h3>소환사 주문 (2개 선택)</h3>
        <div id="spell-select" class="icon-grid"></div>
      </div>

      <div class="setup-section">
        <h3>룬 (1개 선택)</h3>
        <div id="rune-select" class="icon-grid"></div>
      </div>

      <button id="start-btn" class="btn-primary" disabled>게임 시작</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <!-- Status Bar -->
    <div id="status-bar">
      <div class="fighter-status" id="player-status"></div>
      <div class="vs">VS</div>
      <div class="fighter-status" id="enemy-status"></div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area"></div>

    <!-- Suggestions + Input -->
    <div id="bottom-area">
      <div id="suggestions"></div>
      <div id="input-area">
        <input type="text" id="player-input" placeholder="행동을 입력하세요..." disabled>
        <button id="send-btn" disabled>전송</button>
      </div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h2 id="gameover-title"></h2>
      <p id="gameover-summary"></p>
      <div id="gameover-tips"></div>
      <button id="restart-btn" class="btn-primary">새 게임</button>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
